<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Medial Ridge Visualizer</title>
    <style>
      body {
        margin: 18px;
        font-family: system-ui, sans-serif;
        color: #202124;
        background: #f8faf9;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 22px;
      }

      #status {
        margin: 0 0 16px;
        color: #4d5851;
      }

      #stats {
        margin: 0 0 16px;
        padding: 10px 12px;
        border: 1px solid #d8dfda;
        background: #ffffff;
        white-space: pre-wrap;
      }

      #output_grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 14px;
      }

      figure {
        margin: 0;
        padding: 10px;
        border: 1px solid #d8dfda;
        background: #ffffff;
      }

      figcaption {
        margin-bottom: 8px;
        font-weight: 650;
      }

      canvas {
        width: 256px;
        height: 256px;
        image-rendering: pixelated;
        background: #101412;
        border: 1px solid #cbd5cf;
        cursor: zoom-in;
      }

      .settingsbox {
        display: inline-flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px 12px;
        border: 1px solid #d8dfda;
        background: #ffffff;
      }
      #uploader_bar {
        display: inline-grid;
        align-items: center;
        gap: 12px;
      }
      #drop_zone {
        flex: 1 1 auto;
        padding: 10px 12px;
        border: 2px dashed #b8c2bb;
        background: #ffffff;
        color: #4d5851;
        border-radius: 6px;
        text-align: center;
        user-select: none;
      }
      #drop_zone.dragover {
        border-color: #2a8f5a;
        background: #eef8f2;
        color: #256246;
      }
    </style>
  </head>
  <body>
    <h1>Medial Ridge Visualizer</h1>
    <div id="status"></div>
    <div id="controls" class="settingsbox">
      <div>Important settings:</div>
      <label>
        thinning_mode:
        <select id="thinning_mode">
          <option value="sequential_inplace">sequential_inplace</option>
          <option value="parallel_checkerboard">parallel_checkerboard</option>
        </select>
      </label>
      <label>
        <input type="checkbox" id="deterministic_toggle" />
        deterministic
      </label>
      <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap">
        <label><input id="smooth_open_toggle" type="checkbox" /> smooth_open</label>
        <label><input id="smooth_close_toggle" type="checkbox" /> smooth_close</label>
      </div>
      <div>
        <label> <input id="auto_radius_toggle" type="checkbox" /> auto_radius </label>
        |
        <label>
          smoothing_radius:
          <input id="smoothing_radius" type="number" min="0" max="64" step="1" style="width: 3em" />
          (px)
        </label>
      </div>
      <button id="recompute_btn">Recompute</button>
    </div>

    <div id="uploader_bar">
      <input id="file_input" type="file" accept="image/png" />
      <div id="drop_zone">Drop a PNG here, or use the file picker.</div>
    </div>
    <pre id="stats"></pre>
    <div id="output_grid"></div>

    <script src="medial_ridge.js"></script>
    <script>
      (async function run_visualizer() {
        "use strict";

        const status_element = document.getElementById("status");
        const stats_element = document.getElementById("stats");
        const output_grid = document.getElementById("output_grid");
        const ridge = window.medial_ridge;

        try {
          let currentSourceCanvas = null;
          let currentStencil = null;
          let currentLabel = "";

          const file_path = get_file_parameter();

          const ui = init_controls();
          ui.recompute = () => recompute_and_render(ui, currentSourceCanvas, currentStencil, currentLabel);
          ui.recompute_btn.addEventListener("click", ui.recompute);

          init_uploader(async (image, label) => {
            const canvas = draw_source_image(image);
            const imgData = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height);
            currentSourceCanvas = canvas;
            currentStencil = build_stencil_from_red_channel(imgData);
            currentLabel = label;
            status_element.textContent = "Ready: " + label + " (press Recompute)";
          });

          if (file_path) {
            status_element.textContent = "Loading " + file_path;
            const image_url = new URL("../" + file_path, window.location.href);
            const image = await load_image(image_url.href);
            const canvas = draw_source_image(image);
            const imgData = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height);
            currentSourceCanvas = canvas;
            currentStencil = build_stencil_from_red_channel(imgData);
            currentLabel = file_path;
            await ui.recompute();
            status_element.textContent = "Loaded " + file_path;
          } else {
            status_element.textContent = "Drop or upload a PNG, then press Recompute";
          }
        } catch (error) {
          status_element.textContent = error.message;
          stats_element.textContent = "";
        }

        function get_file_parameter() {
          const parameters = new URLSearchParams(window.location.search);
          const raw = parameters.get("file");
          if (!raw) return "";
          // Normalize to be relative to web root: strip leading slashes/backslashes
          const file_path = String(raw).replace(/^[\\\/]+/, "");
          // Disallow path traversal
          if (file_path.includes("..")) {
            throw new Error("The file parameter must stay within the web root");
          }
          return file_path;
        }

        function init_controls() {
          const mode_select = document.getElementById("thinning_mode");
          const det_toggle = document.getElementById("deterministic_toggle");
          const smooth_open_toggle = document.getElementById("smooth_open_toggle");
          const smooth_close_toggle = document.getElementById("smooth_close_toggle");
          const smoothing_radius = document.getElementById("smoothing_radius");
          const auto_radius_toggle = document.getElementById("auto_radius_toggle");
          const recompute_btn = document.getElementById("recompute_btn");

          const defaults = (ridge && ridge.DEFAULT_CONFIG) || window.medial_ridge_config || {};
          mode_select.value =
            defaults.thinning_mode === "sequential_inplace" || defaults.thinning_mode === "parallel_checkerboard" ? defaults.thinning_mode : "parallel_checkerboard";
          det_toggle.checked = defaults.deterministic !== undefined ? !!defaults.deterministic : true;
          smooth_open_toggle.checked = defaults.smooth_open !== undefined ? !!defaults.smooth_open : true;
          smooth_close_toggle.checked = defaults.smooth_close !== undefined ? !!defaults.smooth_close : true;
          auto_radius_toggle.checked = defaults.auto_radius !== undefined ? !!defaults.auto_radius : true;
          smoothing_radius.value = String(Math.max(0, Math.floor(Number(defaults.smoothing_radius) || 0)));

          function read_options() {
            return {
              thinning_mode: mode_select.value,
              deterministic: !!det_toggle.checked,
              smooth_open: !!smooth_open_toggle.checked,
              smooth_close: !!smooth_close_toggle.checked,
              auto_radius: !!auto_radius_toggle.checked,
              smoothing_radius: Math.max(0, Math.floor(Number(smoothing_radius.value) || 0)),
            };
          }

          function apply_smoothing_ui_state() {
            const anySmoothing = !!smooth_open_toggle.checked || !!smooth_close_toggle.checked;
            auto_radius_toggle.disabled = !anySmoothing;
            if (!anySmoothing) {
              smoothing_radius.disabled = true;
            } else {
              smoothing_radius.disabled = !!auto_radius_toggle.checked;
            }
          }

          smooth_open_toggle.addEventListener("change", apply_smoothing_ui_state);
          smooth_close_toggle.addEventListener("change", apply_smoothing_ui_state);
          auto_radius_toggle.addEventListener("change", apply_smoothing_ui_state);
          // initialize state on first load
          apply_smoothing_ui_state();

          return { mode_select, det_toggle, smooth_open_toggle, smooth_close_toggle, smoothing_radius, auto_radius_toggle, recompute_btn, read_options };
        }

        async function recompute_and_render(ui, source_canvas, stencil, label) {
          if (!source_canvas || !stencil) {
            stats_element.textContent = "No image loaded. Drop/upload a PNG, then press Recompute.";
            return;
          }
          const opts = ui.read_options();
          const ridge_data = ridge.compute_ridge_data(stencil, source_canvas.width, source_canvas.height, {
            seed: 0,
            thinning_mode: opts.thinning_mode,
            deterministic: opts.deterministic,
            smooth_open: !!opts.smooth_open,
            smooth_close: !!opts.smooth_close,
            auto_radius: opts.auto_radius,
            smoothing_radius: opts.smoothing_radius,
          });
          render_outputs(source_canvas, ridge_data, source_canvas.width, source_canvas.height, opts, label);
        }

        function load_image(image_url) {
          return new Promise((resolve, reject) => {
            const image = new Image();
            image.onload = () => resolve(image);
            image.onerror = () => reject(new Error("Could not load image: " + image_url));
            image.src = image_url;
          });
        }

        function draw_source_image(image) {
          const canvas = document.createElement("canvas");
          canvas.width = image.naturalWidth;
          canvas.height = image.naturalHeight;
          canvas.getContext("2d").drawImage(image, 0, 0);
          return canvas;
        }

        function load_image_from_file(file) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onerror = () => reject(new Error("Could not read file."));
            reader.onload = () => {
              const img = new Image();
              img.onload = () => resolve(img);
              img.onerror = () => reject(new Error("File is not a valid PNG image."));
              img.src = reader.result;
            };
            reader.readAsDataURL(file);
          });
        }

        function build_stencil_from_red_channel(image_data) {
          const total_pixels = image_data.width * image_data.height;
          const stencil = new Uint8Array(total_pixels);

          for (let pixel_index = 0; pixel_index < total_pixels; pixel_index++) {
            stencil[pixel_index] = image_data.data[pixel_index * 4] ? 255 : 0;
          }

          return stencil;
        }

        function render_outputs(source_canvas, ridge_data, width, height, opts, label) {
          const foreground_count = count_nonzero(ridge_data.foreground);
          const ridge_count = count_nonzero(ridge_data.ridge_binary);
          const pruned_ridge_count = count_nonzero(ridge_data.pruned_ridge_binary);
          const removed_ridge_count = count_nonzero(ridge_data.removed_ridge_binary);
          const max_distance = find_max_sqrt_distance(ridge_data.distance_squared);

          const smoothingLine = (() => {
            const open = !!(opts && opts.smooth_open);
            const close = !!(opts && opts.smooth_close);
            if (!open && !close) return "smoothing: none";
            if (open && close) return "smoothing: open→close";
            if (open) return "smoothing: open";
            return "smoothing: close";
          })();

          stats_element.textContent = [
            "size: " + width + " x " + height,
            "foreground.count: " + foreground_count,
            "ridge_binary.count: " + ridge_count,
            "pruned_ridge_binary.count: " + pruned_ridge_count,
            "removed_ridge_binary.count: " + removed_ridge_count,
            "pruning_iteration_count: " + ridge_data.pruning_iteration_count,
            "max_sqrt(distance_squared): " + max_distance.toFixed(3),
            "thinning_mode: " + (opts && opts.thinning_mode ? opts.thinning_mode : "sequential_inplace"),
            "deterministic: " + (opts && opts.deterministic ? "true" : "false"),
            smoothingLine,
            opts && (opts.smooth_open || opts.smooth_close) ? "auto_radius: " + (opts.auto_radius ? "true" : "false") : null,
            opts && (opts.smooth_open || opts.smooth_close) ? "auto_radius_q: " + ((ridge_data.auto_radius_q || 0).toFixed ? ridge_data.auto_radius_q.toFixed(2) : ridge_data.auto_radius_q || 0) : null,
            opts && (opts.smooth_open || opts.smooth_close) ? "auto_radius_sigma: " + ((ridge_data.auto_radius_sigma || 0).toFixed ? (ridge_data.auto_radius_sigma || 0).toFixed(3) : ridge_data.auto_radius_sigma || 0) : null,
            opts && (opts.smooth_open || opts.smooth_close) ? "auto_global_radius: " + (ridge_data.auto_global_radius || 0) : null,
            label ? "source: " + label : "",
            "stencil_source: red channel > 0",
          ]
            .filter(Boolean)
            .join("\n");

          output_grid.textContent = "";
          append_canvas("source_image", source_canvas);
          if (ridge_data.original_foreground) {
            append_canvas("original_foreground", render_binary_canvas(ridge_data.original_foreground, width, height, 255));
            append_canvas("smoothing_delta", render_smoothing_delta_canvas(ridge_data.original_foreground, ridge_data.foreground, width, height));
          }
          append_canvas("foreground", render_binary_canvas(ridge_data.foreground, width, height, 255));
          if (ridge_data.curvature_hat) {
            append_canvas("curvature_hat", render_curvature_heat_canvas(ridge_data.curvature_hat, width, height));
          }
          append_canvas("distance_squared (heat)", render_distance_heat_canvas(ridge_data.distance_squared, ridge_data.foreground, width, height));
          append_canvas("cornerness", render_cornerness_canvas(ridge_data.cornerness, width, height));
          append_canvas("order (processing)", render_order_canvas(ridge_data.order, width, height));
          append_canvas("ridge_binary", render_binary_canvas(ridge_data.ridge_binary, width, height, 255));
          append_canvas("ridge_radius", render_ridge_radius_canvas(ridge_data.ridge_binary, ridge_data.distance_squared, width, height));
          append_canvas("pruning_comparison", render_pruning_comparison_canvas(ridge_data, width, height));
          append_canvas("pruning_iteration (normalized)", render_pruning_rounds_canvas(ridge_data.pruning_iteration, ridge_data.pruning_iteration_count, width, height));
          append_canvas("pruned_ridge_binary", render_binary_canvas(ridge_data.pruned_ridge_binary, width, height, 255));
        }

        function init_uploader(onImageReady) {
          const file_input = document.getElementById("file_input");
          const drop_zone = document.getElementById("drop_zone");

          file_input.addEventListener("change", async () => {
            if (!file_input.files || file_input.files.length === 0) return;
            const file = file_input.files[0];
            try {
              const img = await load_image_from_file(file);
              onImageReady(img, file.name);
            } catch (e) {
              status_element.textContent = e.message;
            }
          });

          function prevent(e) {
            e.preventDefault();
            e.stopPropagation();
          }
          ["dragenter", "dragover", "dragleave", "drop"].forEach((evt) => {
            drop_zone.addEventListener(evt, prevent, false);
          });
          drop_zone.addEventListener("dragover", () => drop_zone.classList.add("dragover"));
          drop_zone.addEventListener("dragleave", () => drop_zone.classList.remove("dragover"));
          drop_zone.addEventListener("drop", async (e) => {
            drop_zone.classList.remove("dragover");
            const dt = e.dataTransfer;
            if (!dt || !dt.files || dt.files.length === 0) return;
            const file = dt.files[0];
            try {
              const img = await load_image_from_file(file);
              onImageReady(img, file.name);
            } catch (err) {
              status_element.textContent = err.message;
            }
          });
        }

        function append_canvas(title, canvas) {
          const figure = document.createElement("figure");
          const caption = document.createElement("figcaption");
          caption.textContent = title;
          canvas.title = "Open " + title + " in a new tab";
          canvas.addEventListener("click", () => {
            const image_url = canvas.toDataURL("image/png");
            window.open(image_url, "_blank", "noopener");
          });
          figure.appendChild(caption);
          figure.appendChild(canvas);
          output_grid.appendChild(figure);
        }

        // Controls are wired after the image loads in run_visualizer()

        function render_binary_canvas(array_value, width, height, scale_value) {
          return render_array_canvas(array_value, width, height, (value) => (value ? scale_value : 0));
        }

        function render_cornerness_canvas(cornerness, width, height) {
          return render_array_canvas(cornerness, width, height, (value) => Math.round((value / 8) * 255));
        }

        function render_order_canvas(order, width, height) {
          const order_values = new Float64Array(width * height);
          const denominator = Math.max(1, order.length - 1);

          for (let order_index = 0; order_index < order.length; order_index++) {
            const pixel_index = order[order_index];
            order_values[pixel_index] = Math.round((order_index / denominator) * 255);
          }

          return render_array_canvas(order_values, width, height, (value) => value);
        }

        function render_distance_heat_canvas(distance_squared, foreground, width, height) {
          const max_distance = find_max_sqrt_distance(distance_squared);
          return render_color_canvas(width, height, (pixel_index) => {
            if (!foreground[pixel_index] || max_distance === 0) return [0, 0, 0];
            const normalized_value = Math.sqrt(distance_squared[pixel_index]) / max_distance;
            return heat_color(normalized_value);
          });
        }

        function render_ridge_radius_canvas(ridge_binary, distance_squared, width, height) {
          const max_distance = find_max_sqrt_distance(distance_squared);
          return render_color_canvas(width, height, (pixel_index) => {
            if (!ridge_binary[pixel_index] || max_distance === 0) return [0, 0, 0];
            const normalized_value = Math.sqrt(distance_squared[pixel_index]) / max_distance;
            return heat_color(normalized_value);
          });
        }

        function render_curvature_heat_canvas(curvature_hat, width, height) {
          // Normalize by P95 for visualization stability
          const values = Array.from(curvature_hat);
          const sorted = values.slice().sort((a, b) => a - b);
          const p95 = sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * 0.95))] || 1;
          return render_color_canvas(width, height, (i) => {
            const v = Math.max(0, Math.min(1, curvature_hat[i] / (p95 || 1)));
            return heat_color(v);
          });
        }

        function render_radius_field_canvas(radius_field, width, height) {
          // Normalize to max radius for view
          let rmax = 0;
          for (let i = 0; i < radius_field.length; i++) if (radius_field[i] > rmax) rmax = radius_field[i];
          if (rmax <= 0) rmax = 1;
          return render_color_canvas(width, height, (i) => {
            const v = Math.max(0, Math.min(1, radius_field[i] / rmax));
            return heat_color(v);
          });
        }

        function render_pruning_comparison_canvas(ridge_data, width, height) {
          return render_color_canvas(width, height, (pixel_index) => {
            if (ridge_data.pruned_ridge_binary[pixel_index]) return [40, 210, 110];
            if (ridge_data.removed_ridge_binary[pixel_index]) return [235, 70, 55];
            if (ridge_data.ridge_binary[pixel_index]) return [180, 180, 180];
            return [0, 0, 0];
          });
        }

        function render_pruning_rounds_canvas(pruning_iteration, pruning_iteration_count, width, height) {
          return render_color_canvas(width, height, (pixel_index) => {
            const iteration = pruning_iteration[pixel_index];
            if (iteration === 0 || pruning_iteration_count === 0) return [0, 0, 0];
            const normalized_value = iteration / pruning_iteration_count;
            return heat_color(normalized_value);
          });
        }

        function render_smoothing_delta_canvas(original_fg, smoothed_fg, width, height) {
          return render_color_canvas(width, height, (pixel_index) => {
            const o = original_fg[pixel_index] ? 1 : 0;
            const s = smoothed_fg[pixel_index] ? 1 : 0;
            if (o && s) return [160, 160, 160]; // unchanged foreground
            if (!o && s) return [40, 210, 110]; // added by smoothing (dilation after erosion)
            if (o && !s) return [235, 70, 55]; // removed by smoothing (erosion)
            return [0, 0, 0]; // background both
          });
        }

        function render_color_canvas(width, height, map_pixel_to_color) {
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const context = canvas.getContext("2d");
          const image_data = context.createImageData(width, height);

          for (let pixel_index = 0; pixel_index < width * height; pixel_index++) {
            const color = map_pixel_to_color(pixel_index);
            const data_index = pixel_index * 4;
            image_data.data[data_index] = clamp_byte(color[0]);
            image_data.data[data_index + 1] = clamp_byte(color[1]);
            image_data.data[data_index + 2] = clamp_byte(color[2]);
            image_data.data[data_index + 3] = 255;
          }

          context.putImageData(image_data, 0, 0);
          return canvas;
        }

        function heat_color(normalized_value) {
          const value = Math.max(0, Math.min(1, normalized_value));

          if (value < 0.25) {
            const local_value = value / 0.25;
            return [0, Math.round(local_value * 120), 255];
          }

          if (value < 0.5) {
            const local_value = (value - 0.25) / 0.25;
            return [0, 120 + Math.round(local_value * 135), 255 - Math.round(local_value * 255)];
          }

          if (value < 0.75) {
            const local_value = (value - 0.5) / 0.25;
            return [Math.round(local_value * 255), 255, 0];
          }

          const local_value = (value - 0.75) / 0.25;
          return [255, 255 - Math.round(local_value * 255), 0];
        }

        function render_array_canvas(array_value, width, height, map_value_to_gray) {
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const context = canvas.getContext("2d");
          const image_data = context.createImageData(width, height);

          for (let pixel_index = 0; pixel_index < array_value.length; pixel_index++) {
            const gray_value = clamp_byte(map_value_to_gray(array_value[pixel_index], pixel_index));
            const data_index = pixel_index * 4;
            image_data.data[data_index] = gray_value;
            image_data.data[data_index + 1] = gray_value;
            image_data.data[data_index + 2] = gray_value;
            image_data.data[data_index + 3] = 255;
          }

          context.putImageData(image_data, 0, 0);
          return canvas;
        }

        function count_nonzero(array_value) {
          let nonzero_count = 0;

          for (let item_index = 0; item_index < array_value.length; item_index++) {
            if (array_value[item_index]) nonzero_count++;
          }

          return nonzero_count;
        }

        function find_max_sqrt_distance(distance_squared) {
          let max_distance = 0;

          for (let item_index = 0; item_index < distance_squared.length; item_index++) {
            const distance = Math.sqrt(distance_squared[item_index]);
            if (distance > max_distance) max_distance = distance;
          }

          return max_distance;
        }

        function clamp_byte(value) {
          if (!Number.isFinite(value)) return 0;
          return Math.max(0, Math.min(255, Math.round(value)));
        }
      })();
    </script>
  </body>
</html>
